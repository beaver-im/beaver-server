services:
  relation_rpc:
    image: wsrh8888/relation_rpc:1.0.0
    container_name: relation_rpc
    network_mode: "host"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./relation_rpc.yaml:/etc/config.yaml:ro
    restart: "no"
    pull_policy: always

  relation_api:
    image: wsrh8888/relation_api:1.0.0
    container_name: relation_api
    network_mode: "host"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./relation_api.yaml:/etc/config.yaml:ro
    restart: "no"
    pull_policy: always
    depends_on:
      - relation_rpc
