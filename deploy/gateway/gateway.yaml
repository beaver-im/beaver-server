Name: gateway
Addr: 0.0.0.0:20800
etcd: 127.0.0.1:2379
# 服务映射：路径第 3 段 service → 完整 etcd 服务名（未命中默认 {service}_api）。
ServiceAlias:
  account: account_api
  message: message_api
  relation: relation_api
  asset: asset_api
  platform: platform_api
  auth: account_api
  user: account_api
  chat: message_api
  friend: relation_api
  group: relation_api
  file: asset_api
  emoji: asset_api
  circle: social_api
  moment: social_api
  org: platform_api
  workbench: platform_api
  ai: agent_api
  call: call_api
  doc: doc_api
  backend: backend_admin
Log:
  Encoding: json
  TimeFormat: 2006-01-02T15:04:05
  Stat: false
Limit:
  Enable: true
  Rate: 100    # 每秒请求数
  Burst: 200   # 峰值容忍
# 网关统一验外部票 → 写可信身份头（admin 平面 Beaver-Admin-Id，其余 Beaver-User-Id）
# → 注入机器票 → 转发。业务服务默认只挂 JwtS2s；外部票只在此处验。
# 三类外部票统一挂在 Auth 段下，各占一段、密钥各不相同（分别取自各签发方的 Auth.AccessSecret）：
# 网关按段取密钥验签，再靠 claims.Audience 分平面；改任一把须同步对应签发方仓。
Auth:
  AuthBeaver:
    # 主站 C 端用户票，签发方 app/account 的 auth_public。
    AccessSecret: beaver-jwt-user-5a99dd68227b4aa4bca260349995d485
  AuthOpen:
    # 开放平台开发者票，签发方 beaver-open 的 developer 登录。
    AccessSecret: beaver-jwt-open-089b1407d2b0408dbef868f651750d4b
  AuthAdmin:
    # 后台管理员票，签发方 beaver-backend 的 auth_public 登录。
    AccessSecret: beaver-jwt-admin-b2135d16210e40058bc10319272bb994
# 网关注入到下游的机器票。一把密钥 = 一个目标团队，网关按路径 team 选密钥签发，
# 下游用本团队的 S2S.Secret 验签；调用方拿 client_credentials 去目标换票也用目标那把。
# 查表键与下方 Audiences 完全一致（team/surface 精确键 → team → Default）。
Machine:
  Secrets:
    beaver: beaver-s2s-core-b0db00321ca84fc783a2ba81505e82b1
    beaver/admin: beaver-s2s-admin-2a8e5c1d7f4b6039a2c8e5d1f7b40639
    beaver-open: beaver-s2s-open-a1c9e7d3405b4f268e5a1d7c9b3f6402
    beaver-social: beaver-s2s-social-73d1e5b9a2c846f0b3e7d9a1c5f28064
    beaver-doc: beaver-s2s-doc-8c4f1a6e2b9d5037a1e6f4c8d2b97053
    beaver-call: beaver-s2s-call-1e6b4d9a7c2f8053b6e1a9d4c7f28305
    beaver-ai: beaver-s2s-ai-c5e8a1d4b7f20396a1c5e8d4b7f20369
  DefaultSecret: beaver-s2s-core-b0db00321ca84fc783a2ba81505e82b1
  DefaultAudience: core:api
  # 各 team 业务空壳写死的 S2S audience，网关注入机器票必须按 team 选对，否则 401。
  Audiences:
    beaver: core:api
    beaver-open: open:internal
    beaver-social: social:internal
    beaver-doc: doc:internal
    beaver-call: call:internal
    beaver-ai: ai:internal
    beaver/admin: admin:internal
  ClientID: gateway
  Issuer: beaver-gateway
# 公开端点正则：命中任一即不验外部票（登录/换票/预览/ws/回调等）。
# 用 URL 六段式结构表达规范，避免逐条硬编码；新增 _public 组或 machine token 端点零配置。
PublicPatterns:
  # 通用规则 1：group 段以 _public 结尾的整组公开
  - ^/[^/]+/(?:api|admin)/[^/]+/[^/]+_public/v1/
  # 通用规则 2：各团队的换票端点 group=machine + action=token
  - ^/[^/]+/api/[^/]+/machine/v1/token$
  # 以下为命名不合规特例（group 未用 _public，须 action 级精确放行；规整命名后可删）：
  - ^/beaver/api/account/auth_token/v1/issue$      # 换票口
  - ^/beaver/api/asset/preview/v1/get$             # 文件预览
  - ^/beaver-open/api/open/developer/v1/auth_login$         # 开发者登录
  - ^/beaver-open/api/open/developer/v1/auth_oauth_login$   # OAuth 登录
  - ^/beaver-open/api/open/developer/v1/file_preview$       # 文件预览
  - ^/beaver-open/api/open/ws/v1/connect$           # ws 握手
  - ^/beaver-open/api/open/oauth_secret/v1/         # 应用级凭据面（本地 OauthSecretAuth 校验）
  - ^/beaver-call/api/call/webhook/v1/callback$     # LiveKit 回调（裸 service，无中间件）
# 鉴权平面规则：按声明顺序取首个命中；未命中默认 beaver（主站用户票）。
# 顺序即优先级——特例排前、team 级排后，无需最长前缀比较。
AuthRules:
  # IM 客户端自用 oauth 面走用户票，须排在 beaver-open 之前压过 open 组
  - Pattern: ^/beaver-open/api/open/oauth/v1/
    Ticket: beaver
  - Pattern: ^/beaver-open/
    Ticket: open
  - Pattern: ^/beaver/admin/
    Ticket: admin
