Auth:
  AuthBeaver:
    AccessSecret: beaver-jwt-user-5a99dd68227b4aa4bca260349995d485
  AuthOpen:
    AccessSecret: beaver-jwt-open-089b1407d2b0408dbef868f651750d4b
  AuthAdmin:
    AccessSecret: beaver-jwt-admin-b2135d16210e40058bc10319272bb994
Assertion:
  KeyID: gateway-2026-11
  # 生产优先 PrivateKeyFile（K8s secret 挂载）；本地可用 PEM 兜底。
  PrivateKeyFile: ../../../deploy/keys/gateway-assertion.pem
  PrivateKeyPEM: |
    -----BEGIN EC PRIVATE KEY-----
    MHcCAQEEILSGk6pvfx6aZXeCfxlQOdmqj3QvgZdPytrL2KyjIEIsoAoGCCqGSM49
    AwEHoUQDQgAE46Jx5dTVRu4EQsot+rtD1lBS302SYrVJ7EJsHblRtijARuxPdrsz
    i5Y7udkvEzi0cLH35A34ydkA6fWPKoLpnA==
    -----END EC PRIVATE KEY-----
  Issuer: beaver-gateway
  ClientID: gateway
