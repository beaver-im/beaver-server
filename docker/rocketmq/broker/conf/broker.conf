brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
autoCreateTopicEnable = true
namesrvAddr = rocketmq-namesrv:9876
brokerIP1 = 127.0.0.1
# 开启 ACL；账号见同目录 plain_acl.yml（挂载到 $ROCKETMQ_HOME/conf/plain_acl.yml）
aclEnable = true
# 磁盘水位三个独立阈值（都是百分比整数，写 0.95 这种小数会解析失败并静默退回默认值）：
#   diskSpaceWarningLevelRatio  = 拒绝写入水位，超过即 SERVICE_NOT_AVAILABLE(CODE 14)，默认 90
#   diskSpaceCleanForciblyRatio = 强制清理水位，默认 85
#   diskMaxUsedSpaceRatio       = 按空间删除过期 commitlog 的触发水位，默认 75
# 只调 diskMaxUsedSpaceRatio 没用：它被 diskSpaceWarningLevelRatio 挡在前面。
# 约束：diskMaxUsedSpaceRatio <= diskSpaceWarningLevelRatio，且 cleanForcibly < warning。
# 本地开发机磁盘常年 90%+，故放宽到 97；生产环境应按容量规划，不要照抄。
diskMaxUsedSpaceRatio = 90
diskSpaceWarningLevelRatio = 97
diskSpaceCleanForciblyRatio = 93
